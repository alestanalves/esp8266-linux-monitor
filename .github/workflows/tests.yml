name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: python -m pip install '.[dev,flash]'
      - name: Run tests (no USB device required)
        run: python -m pytest -q
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q host firmware scripts
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate systemd unit syntax
        run: |
          mkdir -p "$RUNNER_TEMP/tft-monitor-unit"
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' systemd/tft-monitor.service > "$RUNNER_TEMP/tft-monitor-unit/tft-monitor.service"
          systemd-analyze verify "$RUNNER_TEMP/tft-monitor-unit/tft-monitor.service"
      - name: Check installed collector and package build
        run: |
          tft-monitor --version
          tft-monitor --once
          python -m pip wheel --no-deps --wheel-dir dist .
